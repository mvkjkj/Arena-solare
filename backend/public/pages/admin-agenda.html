<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda | SOLARE ARENA</title>

    <link rel="stylesheet" href="../css/admin-agenda.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <div>
            <h1>☀️ SOLARE</h1>
            <p>ARENA • Agenda das Quadras</p>
        </div>

        <button onclick="location.href='admin.html'">
            ← Painel Administrativo
        </button>

    </header>


    <!-- CONTEÚDO -->
    <main class="container">

        <!-- FILTRO -->
        <section class="filtro card-filtro">

            <div>
                <label for="data">
                    Selecionar data
                </label>

                <input
                    type="date"
                    id="data"
                >
            </div>

            <button id="atualizar">
                🔄 Atualizar Agenda
            </button>

        </section>


        <!-- AGENDA -->
        <section>

            <div class="titulo-agenda">

                <div>
                    <h2>📅 Agenda do dia</h2>

                    <p>
                        Visualize a ocupação das quadras em tempo real.
                    </p>
                </div>

            </div>


            <div id="agenda">

                <p class="carregando">
                    Carregando agenda...
                </p>

            </div>

        </section>

    </main>


    <script src="../js/auth.js"></script>
    <script src="../js/admin-agenda.js"></script>

</body>

</html>
