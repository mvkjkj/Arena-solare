<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda | SOLARE ARENA</title>

    <link rel="stylesheet" href="../css/admin-agenda.css">
</head>

<body>

    <header class="topbar">

        <div class="marca">
            <span class="icone-sol">☀</span>

            <div>
                <h1>SOLARE</h1>
                <span>ARENA</span>
            </div>
        </div>

        <button
            class="btn-voltar"
            onclick="location.href='admin.html'">
            ← Painel Administrativo
        </button>

    </header>


    <main class="container">

        <section class="hero-agenda">

            <div>
                <span class="etiqueta">ADMINISTRAÇÃO</span>

                <h2>Agenda das Quadras</h2>

                <p>
                    Acompanhe a ocupação das quadras e visualize
                    as reservas da SOLARE ARENA.
                </p>
            </div>

        </section>


        <section class="filtro card">

            <div class="campo-data">

                <label for="data">
                    Data da agenda
                </label>

                <input
                    type="date"
                    id="data">

            </div>

            <button
                id="atualizar"
                class="btn-atualizar">
                🔄 Atualizar Agenda
            </button>

        </section>


        <section class="agenda-section">

            <div class="titulo-agenda">

                <div>
                    <span class="etiqueta">RESERVAS</span>

                    <h2>Agenda do dia</h2>

                    <p>
                        Visualização dos horários e ocupação das quadras.
                    </p>
                </div>

            </div>


            <div id="agenda" class="lista-agenda">

                <p class="carregando">
                    Carregando agenda...
                </p>

            </div>

        </section>

    </main>


    <footer>
        <span>☀ SOLARE ARENA</span>
        <p>Gestão de quadras e reservas</p>
    </footer>


    <script src="../js/auth.js"></script>
    <script src="../js/admin-agenda.js"></script>

</body>

</html>
