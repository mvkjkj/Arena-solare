<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recepção | SOLARE ARENA</title>

    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <div class="sidebar">

        <h2>☀️ SOLARE</h2>
        <small>ARENA</small>

        <hr>

        <button onclick="location.href='/dashboard'">
            🏠 Dashboard
        </button>

        <button onclick="location.href='/pages/reserva.html'">
            📅 Nova Reserva
        </button>

        <button onclick="location.href='/pages/minhas-reservas.html'">
            📋 Minhas Reservas
        </button>

        <button onclick="location.href='/pages/perfil.html'">
            👤 Meu Perfil
        </button>

        <button class="active">
            🖥 Recepção
        </button>

        <button onclick="location.href='/pages/admin.html'">
            ⚙ Administração
        </button>

        <button onclick="sair()">
            🚪 Sair
        </button>

    </div>


    <!-- CONTEÚDO -->
    <div class="content">

        <header>

            <h1>Recepção</h1>

            <p>
                Controle a agenda, pagamentos e atendimento da SOLARE ARENA.
            </p>

        </header>


        <!-- FILTROS -->
        <section class="cards">

            <div class="card">

                <h2>📅 Agenda</h2>

                <div class="topo">

                    <input
                        type="date"
                        id="data"
                    >

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar cliente..."
                    >

                    <button id="novaReserva">
                        + Nova Reserva
                    </button>

                </div>

            </div>

        </section>


        <!-- TABELA -->
        <section class="card tabela-container">

            <h2>Reservas do dia</h2>

            <div class="tabela-scroll">

                <table>

                    <thead>

                        <tr>
                            <th>Horário</th>
                            <th>Cliente</th>
                            <th>Modalidade</th>
                            <th>Valor</th>
                            <th>Pagamento</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody id="listaReservas">

                        <tr>
                            <td colspan="7">
                                Carregando reservas...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <!-- MODAL -->
    <div
        id="modal"
        class="modal"
    >

        <div class="modal-content">

            <h2>Detalhes da reserva</h2>

            <p>
                <strong>Cliente:</strong>
                <span id="modalCliente"></span>
            </p>

            <p>
                <strong>Modalidade:</strong>
                <span id="modalModalidade"></span>
            </p>

            <p>
                <strong>Horário:</strong>
                <span id="modalHorario"></span>
            </p>

            <p>
                <strong>Valor:</strong>
                <span id="modalValor"></span>
            </p>

            <button id="confirmarPagamento">
                💳 Confirmar pagamento
            </button>

            <button id="checkin">
                ✅ Fazer check-in
            </button>

            <button id="cancelar">
                ❌ Cancelar reserva
            </button>

            <button id="fechar">
                Fechar
            </button>

        </div>

    </div>


    <script src="/js/auth.js"></script>
    <script src="/js/recepcao.js"></script>

</body>

</html>
