<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Beach Center</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🏖️ Beach Center</h1>

        <p>Crie sua conta</p>

        <form id="cadastroForm">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                required>

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required>

            <input
                type="text"
                id="telefone"
                placeholder="Telefone">

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required>

            <button type="submit">

                Criar Conta

            </button>

        </form>

        <p class="cadastro">

            Já possui conta?

            <a href="/pages/login.html">

                Entrar

            </a>

        </p>

        <a class="voltar" href="/">

            ← Voltar ao início

        </a>

    </div>

</div>

<script src="../js/cadastro.js"></script>

</body>

</html>
