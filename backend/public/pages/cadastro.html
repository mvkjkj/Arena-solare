<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta | SOLARE ARENA</title>

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🏖️ SOLARE</h1>

        <p>Crie sua conta e faça sua reserva</p>

        <form id="cadastroForm">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                autocomplete="email"
                required
            >

            <input
                type="text"
                id="telefone"
                placeholder="Telefone"
                autocomplete="tel"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <p class="cadastro">

            Já possui conta?

            <a href="/pages/login.html">
                Entrar
            </a>

        </p>

        <a class="voltar" href="/">
            ← Voltar ao início
        </a>

    </div>

</div>

<script src="../js/cadastro.js"></script>

</body>

</html>
