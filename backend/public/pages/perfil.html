<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | SOLARE ARENA</title>

    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <div class="sidebar">

        <h2>☀️ SOLARE</h2>
        <small>ARENA</small>

        <hr>

        <button onclick="location.href='/dashboard'">
            🏠 Dashboard
        </button>

        <button onclick="location.href='/pages/reserva.html'">
            📅 Nova Reserva
        </button>

        <button onclick="location.href='/pages/minhas-reservas.html'">
            📋 Minhas Reservas
        </button>

        <button class="active">
            👤 Meu Perfil
        </button>

        <button id="btnRecepcao">
            🖥 Recepção
        </button>

        <button id="btnAdmin">
            ⚙ Administração
        </button>

        <button onclick="sair()">
            🚪 Sair
        </button>

    </div>


    <!-- CONTEÚDO -->
    <div class="content">

        <header>

            <h1>Meu Perfil</h1>

            <p>
                Gerencie suas informações pessoais e sua conta.
            </p>

        </header>


        <!-- INFORMAÇÕES PESSOAIS -->
        <section class="cards">

            <div class="card">

                <h2>Informações pessoais</h2>

                <form id="perfilForm">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        autocomplete="name"
                        required
                    >


                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        disabled
                    >


                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        autocomplete="tel"
                    >


                    <button type="submit">
                        💾 Salvar alterações
                    </button>

                </form>

            </div>


            <!-- ALTERAR SENHA -->
            <div class="card">

                <h2>🔐 Alterar senha</h2>

                <form id="senhaForm">

                    <label for="senha">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >


                    <label for="confirmarSenha">
                        Confirmar nova senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >


                    <button type="submit">
                        🔐 Alterar senha
                    </button>

                </form>

            </div>

        </section>

    </div>


    <script src="/js/auth.js"></script>
    <script src="/js/perfil.js"></script>

</body>

</html>
