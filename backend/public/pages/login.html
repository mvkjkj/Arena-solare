<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Beach Center</title>

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🏖️ Beach Center</h1>

        <p>Entre na sua conta</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">

                Entrar

            </button>

        </form>

        <p class="cadastro">

            Ainda não possui conta?

            <a href="/pages/cadastro.html">

                Criar Conta

            </a>

        </p>

        <a class="voltar" href="/">

            ← Voltar ao início

        </a>

    </div>

</div>

<script src="../js/login.js"></script>

</body>

</html>
