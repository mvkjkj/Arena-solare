<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Funcionários</title>

<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<header>

<h1>👥 Funcionários</h1>

<p>Gerenciamento da equipe</p>

</header>

<section class="tabela">

<h2>Novo Funcionário</h2>

<form id="formFuncionario">

<input
type="text"
id="nome"
placeholder="Nome"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="text"
id="telefone"
placeholder="Telefone">

<input
type="password"
id="senha"
placeholder="Senha"
required>

<select id="tipo">

<option value="recepcao">Recepção</option>

<option value="gerente">Gerente</option>

<option value="admin">Administrador</option>

</select>

<button type="submit">

Cadastrar

</button>

</form>

<br>

<h2>Equipe</h2>

<table>

<thead>

<tr>

<th>Nome</th>

<th>Email</th>

<th>Telefone</th>

<th>Cargo</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="listaFuncionarios">

<tr>

<td colspan="5">

Carregando...

</td>

</tr>

</tbody>

</table>

</section>

<script src="../js/auth.js"></script>
<script src="../js/funcionarios.js"></script>

</body>

</html>
