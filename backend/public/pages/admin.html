<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração | SOLARE ARENA</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="admin-header">

        <div>
            <h1>☀️ SOLARE</h1>
            <p>ARENA • Painel Administrativo</p>
        </div>

        <button
            class="btn-voltar"
            onclick="location.href='/dashboard'"
        >
            ← Dashboard
        </button>

    </header>


    <!-- CONTEÚDO -->
    <main class="admin-container">


        <!-- AÇÕES -->
        <section class="acoes">

            <button
                class="btn-agenda"
                onclick="location.href='admin-agenda.html'"
            >
                📅 Agenda das Quadras
            </button>

        </section>


        <!-- INDICADORES -->
        <section class="cards">

            <div class="card">

                <span class="icone">👥</span>

                <div>
                    <h3>Clientes</h3>
                    <h2 id="clientes">0</h2>
                </div>

            </div>


            <div class="card">

                <span class="icone">📅</span>

                <div>
                    <h3>Reservas</h3>
                    <h2 id="reservas">0</h2>
                </div>

            </div>


            <div class="card">

                <span class="icone">💰</span>

                <div>
                    <h3>Faturamento</h3>
                    <h2 id="faturamento">R$ 0,00</h2>
                </div>

            </div>


            <div class="card">

                <span class="icone">💳</span>

                <div>
                    <h3>Pendentes</h3>
                    <h2 id="pendentes">0</h2>
                </div>

            </div>

        </section>


        <!-- RESERVAS -->
        <section class="tabela">

            <div class="tabela-topo">

                <div>
                    <h2>Todas as Reservas</h2>

                    <p>
                        Consulte e gerencie os agendamentos da arena.
                    </p>
                </div>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔍 Pesquisar cliente, modalidade ou status..."
                >

            </div>


            <div class="tabela-scroll">

                <table>

                    <thead>

                        <tr>
                            <th>Cliente</th>
                            <th>Modalidade</th>
                            <th>Data</th>
                            <th>Horário</th>
                            <th>Valor</th>
                            <th>Pagamento</th>
                            <th>Status</th>
                            <th>Pagamento</th>
                            <th>Reserva</th>
                        </tr>

                    </thead>


                    <tbody id="listaReservas">

                        <tr>

                            <td colspan="9">
                                Carregando reservas...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>

</body>

</html>
